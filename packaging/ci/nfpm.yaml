name: openshield
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
release: ${PACKAGE_RELEASE}
section: net
priority: optional
maintainer: OpenShield developers
vendor: OpenShield
homepage: https://github.com/UncleStephenCode/openshield
license: GPL-3.0-only
description: Application-aware Linux host firewall written in Rust.

contents:
  # Environment interpolation for content paths requires nFPM's explicit
  # `expand` option. Fixed paths keep this staging boundary easy to audit.
  - src: .package-root/usr/
    dst: /usr

scripts:
  postinstall: packaging/ci/hooks/postinstall-systemd.sh

overrides:
  deb:
    depends:
      - nftables | iptables
  rpm:
    depends:
      - ${RPM_FIREWALL_DEPENDENCY}
      # The unit consumes tmpfiles after package installation and at boot.
      # Depend on the executable path so each RPM distribution can select its
      # native provider (including systemd-mini where it is supported).
      - /usr/bin/systemd-tmpfiles
    recommends:
      - nftables
